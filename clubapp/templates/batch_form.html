{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>新建招新问卷</h1><p>先选择开放部门并保存草稿，再自定义题目、预览和发布。</p></div></div><section class="panel narrow"><form method="get"><label>社团<select name="club_id" onchange="this.form.submit()">{% for c in clubs %}<option value="{{ c.id }}" {{ 'selected' if cid==c.id }}>{{ c.name }}</option>{% endfor %}</select></label></form><form method="post">{{ csrf() }}<input type="hidden" name="club_id" value="{{ cid }}"><label>招新标题<input name="title" required maxlength="120"></label><label>招新说明<textarea name="description"></textarea></label><div class="form-grid"><label>开始时间<input type="datetime-local" name="starts_at" required></label><label>结束时间<input type="datetime-local" name="ends_at" required></label></div><h3>开放部门</h3><div class="choices">{% for d in departments %}<label><input type="checkbox" name="departments" value="{{ d.id }}">{{ d.name }}</label>{% else %}<p>请先在社团详情页创建部门。</p>{% endfor %}</div><button>创建草稿并编辑题目</button></form></section>{% endblock %}
