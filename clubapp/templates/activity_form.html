{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>{{ '修改活动' if a else '创建活动' }}</h1><p>先保存草稿，再提交审批。已发布活动修改后将通知报名成员。</p></div></div><form method="post" class="panel narrow">{{ csrf() }}{% if not a %}<label>所属社团<select name="club_id" required>{% for c in clubs %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label>{% endif %}<label>活动名称<input name="title" value="{{ a.title if a else '' }}" required maxlength="120"></label><label>活动内容<textarea name="description" required rows="6">{{ a.description if a else '' }}</textarea></label><label>活动地点<input name="location" value="{{ a.location if a else '' }}" required></label><div class="form-grid">{% for key,label in [('starts_at','开始时间'),('ends_at','结束时间'),('deadline','报名截止时间')] %}<label>{{ label }}<input type="datetime-local" name="{{ key }}" value="{{ a[key][:16]|replace(' ','T') if a else '' }}" required></label>{% endfor %}<label>人数上限<input name="capacity" type="number" min="1" max="10000" value="{{ a.capacity if a else 30 }}" required></label></div><button>保存活动</button></form>{% endblock %}
