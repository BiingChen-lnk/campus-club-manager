{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>站内通知</h1><p>审核结果、活动调整，都在这里。</p></div><form method="post">{{ csrf() }}<button class="secondary">全部标为已读</button></form></div><section class="panel">{% for n in items %}<div class="list-item"><div><p>{{ n.content }}</p><small>{{ n.created_at }}</small></div><span class="badge {{ 'pending' if not n.read_at else '' }}">{{ '未读' if not n.read_at else '已读' }}</span></div>{% else %}<p class="empty">暂时没有通知。</p>{% endfor %}</section>{% endblock %}
