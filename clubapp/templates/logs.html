{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>操作日志</h1><p>保留最近 300 条关键操作，便于核对。</p></div></div><form class="filter"><label>社团<select name="club_id" onchange="this.form.submit()">{% for c in clubs %}<option value="{{ c.id }}" {{ 'selected' if request.args.get('club_id')==c.id|string }}>{{ c.name }}</option>{% endfor %}</select></label></form><section class="panel"><div class="table-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>对象</th><th>详情</th></tr></thead><tbody>{% for l in items %}<tr><td>{{ l.created_at }}</td><td>{{ l.actor or '系统' }}</td><td>{{ l.action }}</td><td>{{ l.object_type }} #{{ l.object_id or '' }}</td><td>{{ l.detail|status }}</td></tr>{% else %}<tr><td colspan="5">暂无可查看的操作记录。</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
