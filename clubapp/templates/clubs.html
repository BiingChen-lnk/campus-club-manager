{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">COMMUNITIES</span><h1>社团与成员</h1><p>在这里找到志同道合的人。</p></div></div><div class="cards">{% for c in clubs %}<article class="panel"><div class="club-icon">{{ c.name[:1] }}</div><h2>{{ c.name }}</h2><p class="muted">{{ c.description }}</p><a href="{{ url_for('main.club',club_id=c.id) }}">查看社团 →</a></article>{% else %}<div class="panel empty">尚未创建社团。</div>{% endfor %}</div>{% if is_admin() %}<details class="panel"><summary>创建社团</summary><form method="post">{{ csrf() }}<div class="form-grid"><label>社团名称<input name="name" required maxlength="80"></label><label>负责人学号<input name="owner_no" required></label></div><label>社团简介<textarea name="description"></textarea></label><button>创建社团</button></form></details>{% endif %}{% endblock %}
