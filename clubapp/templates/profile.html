{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>个人资料</h1><p>已提交的问卷仍保留当时填写的资料。</p></div></div><form class="panel narrow" method="post">{{ csrf() }}<label>学号<input value="{{ g.user.student_no }}" disabled></label>{% for key,label in [('name','姓名'),('major','专业'),('grade','年级'),('phone','联系方式')] %}<label>{{ label }}<input name="{{ key }}" value="{{ g.user[key] }}" required></label>{% endfor %}<h3>修改密码</h3><p class="muted">不修改时留空。</p><label>原密码<input type="password" name="old_password" autocomplete="current-password"></label><label>新密码<input type="password" name="new_password" minlength="8" autocomplete="new-password"></label><button>保存资料</button></form>{% endblock %}
